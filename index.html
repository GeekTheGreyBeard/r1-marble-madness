<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Marble Madness · R1 Creation</title><link rel="stylesheet" href="styles.css"></head><body>
<header><span>R1 / creations</span><button id="theme" aria-label="toggle theme">☾</button></header>
<main><section class="title"><h1>marble<br>madness</h1><span class="sticker">☻</span><p>tilt through the maze. keep rolling.</p></section>
<section class="hud" aria-label="game status"><span id="level">level 01</span><span id="lives">● ● ●</span><span id="timer">50.0</span></section>
<div class="canvas-wrap"><canvas id="game" width="320" height="520" aria-label="marble madness game board"></canvas><div id="notice" role="status"></div></div>
<section class="controls"><button id="pause">pause</button><button id="restart">restart</button><button id="tilt">enable tilt</button></section>
<p class="help">R1: tilt to roll · rotate crown to pause/restart when focus is on a control.<br>desktop: arrows/WASD or tap + hold an edge of the board.</p>
</main><script type="module" src="app.js"></script></body></html>
