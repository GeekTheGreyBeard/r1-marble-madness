<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Marble Madness · R1 Creation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="r1-shell" aria-label="Marble Madness R1 game">
    <div class="canvas-wrap">
      <canvas id="game" width="240" height="282" aria-label="fixed R1 game display; the maze scrolls inside this frame"></canvas>
      <section id="hud" class="hud" aria-label="game status" hidden><span id="level">01</span><span id="lives">● ● ●</span><span id="timer">75.0</span></section>
      <button id="tilt" class="tilt-control" aria-label="enable tilt controls" hidden>tilt</button>
      <button id="waffle" class="waffle" aria-label="open controls and options" aria-expanded="false" hidden>☰</button>
      <div id="notice" role="status"></div>
      <section id="splash" class="screen splash-screen" aria-label="Marble Madness opening screen">
        <div class="logo-orb" aria-hidden="true"></div><h1>marble<br>madness</h1><p>tap to continue</p>
        <button id="continue" class="screen-hit" aria-label="continue to the main menu">tap to continue</button>
      </section>
      <section id="start-menu" class="screen menu-screen" aria-label="Marble Madness main menu" hidden>
        <div class="menu-title">marble madness</div><p>four rolling runs.<br>one tiny wild maze.</p>
        <button id="start" class="primary">start game</button><button id="start-waffle" class="secondary">☰ options</button>
      </section>
      <section id="menu" class="menu-overlay" aria-label="game controls and options" hidden>
        <div class="menu-panel"><div class="menu-heading"><span>paused</span><button id="close-menu" aria-label="resume game">×</button></div><p><span id="tilt-status">tilt ready — tap tilt to enable</span><br>arrows/WASD or hold a board edge steer.<br>space bounces · shift+space super bounces.</p><div class="menu-grid"><button id="jump">bounce</button><button id="super">super bounce</button><button id="audio">audio on</button><button id="pause">pause</button><button id="restart">restart</button><button id="theme">light mode</button></div><button id="resume" class="primary">continue</button></div>
      </section>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
